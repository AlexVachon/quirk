name: Test

# Fires on every push to main and every PR targeting main, and by hand
# on any branch (`gh workflow run test.yml --ref <branch>`). Three
# parallel jobs:
#
#   test      — vanilla build, runs the stdlib test suite + the
#               adversarial probe suite, then rehearses a release
#               (tools/rehearse_release.sh). Fails on any SIGSEGV, ICE,
#               LLVM verifier abort, or wrong output.
#
#   macos     — the macOS arm64 build, probes and release rehearsal,
#               so a macOS-only break shows up here instead of in the
#               release build after the tag is out (v7.0.1).
#
#   windows   — the native Windows build (MSVC + conda-forge LLVM 14,
#               tools/windows_build.sh in strict mode): fails when
#               quirk.exe / runtime.dll don't build, a smoke program
#               fails, or the test suite has failures (v7.28.0). The
#               windows-probe workflow keeps the never-failing variant.
#
#   ubsan     — same probes, with the runtime built under
#               -fsanitize=undefined. Catches latent UB (signed
#               overflow, null deref, OOB, alignment, etc.) that a
#               functional test can't see. Ships as a separate matrix
#               entry so a flaky sanitizer hit doesn't block a
#               release-blocking functional regression.
#
# Both jobs build inside ubuntu:20.04 to match the release build's
# glibc baseline. Same toolchain setup as release.yml — duplicated
# rather than factored out because GitHub Actions doesn't have a
# clean way to share container steps across jobs without paying for
# composite-action complexity that isn't worth it for two jobs.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      # Public resolvers: Azure's (168.63.129.16, the runner default) stopped
      # resolving *.ubuntu.com on 2026-11-11, so apt-get couldn't reach the
      # archive (github.com etc. still resolved). Harmless when it works.
      options: --dns 8.8.8.8 --dns 1.1.1.1
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg lsb-release software-properties-common git

      - name: Add LLVM 14 apt repository
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/focal/ llvm-toolchain-focal-14 main" \
            > /etc/apt/sources.list.d/llvm-14.list
          apt-get update

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential gcc g++ make pkg-config \
            llvm-14 libllvm14 llvm-14-dev clang-14 \
            libgc-dev libssl-dev libsdl2-2.0-0

      - uses: actions/checkout@v4

      - name: Bootstrap stdlib
        working-directory: quirk-compiler
        run: make bootstrap-stdlib

      - name: Build
        working-directory: quirk-compiler
        run: make -j"$(nproc)"

      - name: Run stdlib tests
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # Iterate every tests/*.quirk that isn't a known shell harness.
        # A test "fails" only when the *runtime crashes* — an ICE, a
        # SIGSEGV, or an LLVM verifier abort. Functional assertions
        # (assert_eq etc.) are checked by each test's own framework
        # output; many tests deliberately throw exceptions, so the
        # exit code alone isn't a reliable signal.
        run: |
          set +e
          fails=0
          for t in tests/*.quirk; do
            case "$t" in *compiler_errors*) continue ;; esac
            # Use bin/quirk-cpp explicitly: the driver (bin/quirk) now
            # prefers the selfhost pipeline, which is frozen at 40/60
            # corpus. The general test suite is meant to validate the
            # production compiler; selfhost has its own regression
            # coverage (corpus + p85 + bootstrap fixed-point).
            out=$(timeout 30 ./bin/quirk-cpp --no-aot --no-cache "$t" 2>&1)
            rc=$?
            if echo "$out" | grep -qE "Internal compiler error|malformed IR|core dumped|Aborted \(core|Segmentation fault"; then
              echo "::error file=$t::stdlib test crashed: $t"
              echo "$out" | head -10
              fails=$((fails + 1))
            elif [ $rc -eq 139 ] || [ $rc -eq 134 ] || [ $rc -eq 136 ]; then
              # 139=SIGSEGV, 134=SIGABRT, 136=SIGFPE — process died from
              # a signal even if the marker grep above missed it.
              echo "::error file=$t::stdlib test died with signal rc=$rc: $t"
              echo "$out" | head -10
              fails=$((fails + 1))
            elif echo "$out" | tail -5 | grep -qiE "^FAIL:|^[0-9]+ failed|tests? failed"; then
              # Some test frameworks print a final "N failed" line on
              # assertion failures while still exiting 0. Treat those
              # as failures too.
              echo "::error file=$t::stdlib test assertion failure: $t"
              echo "$out" | tail -10
              fails=$((fails + 1))
            fi
          done
          echo "stdlib failures: $fails"
          exit $fails

      - name: Run tests (quirk test)
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # Every `define test_*()` in tests/*_test.quirk must pass — the step
        # above only catches crashes. Excluded: server_test (a demo server
        # that runs until killed), custom_package_test (needs the `slug`
        # package installed), http_client_test (its own step below, against
        # a local fixture) and test_test (checks the framework counts
        # deliberately failing cases).
        run: >
          bin/quirk test tests --timeout 60
          --exclude server_test --exclude custom_package_test
          --exclude http_client_test --exclude test_test

      - name: Run http client tests against in-repo fixture
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # Spin up tests/fixtures/httpbin_lite.py and point
        # http_client_test.quirk at it. No external network
        # dependency — `http://httpbin.org` outages can no longer
        # block a release. The wrapper script handles
        # start / wait-for-ready / cleanup; if it exits 0 we
        # treat the test as passed.
        run: |
          set +e
          out=$(timeout 60 tests/fixtures/run_http_tests.sh 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ] \
             || echo "$out" | grep -qE "Internal compiler error|malformed IR|core dumped|Aborted \(core|Segmentation fault" \
             || echo "$out" | tail -5 | grep -qiE "^[0-9]+ failed|tests? failed"; then
            echo "::error::http client tests failed"
            exit 1
          fi

      - name: Run probe suite
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
          # Fail on any value object without a runtime type header.
          QUIRK_CHECK_HEADERS: "1"
        # Every probe in tests/probes/ documents the bug class it
        # protects against. A probe fails when it crashes or times out,
        # reports a compile error, or prints a `FAIL` line. Probes that
        # lock a diagnostic say so with `// expect-error: <text>` and fail
        # only if that text is missing. (Until v6.0.1 this step only
        # caught crashes, so probes failing with type errors went
        # unnoticed — p42 / p48 / p50 / p40 / p44 among them.)
        run: tools/check_probes.sh

      - name: Check editor JSON
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # `--symbols-json` types and `--diagnostics-json` codes, as the
        # VS Code extension and quirk-lsp read them.
        run: tools/check_editor_json.sh

      - name: Check quirk test
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # `define test_*()` discovery, per-test results, setup/teardown,
        # crashes and -k, on tools/fixtures/quirk_test.
        run: tools/check_test_runner.sh

      - name: Check quirk run --watch
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # Runs again on a change, not when it doesn't compile; stops on SIGINT.
        run: tools/check_watch.sh

      - name: Check quirk bundle
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # A folder that runs moved elsewhere, with an empty environment.
        run: tools/check_bundle.sh

      - name: Check installed packages with the same names
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # Two packages in site-packages/ with a Theme and a dark() each.
        run: tools/check_site_packages.sh

      - name: Check package discovery
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # `quirk search` / `quirk show` against a file:// registry and
        # pre-filled caches — no network.
        run: tools/check_discovery.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: quirk-lsp smoke test
        working-directory: quirk-lsp
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
          QUIRK: ${{ github.workspace }}/quirk-compiler/bin/quirk
        # Starts the built server over stdio and checks diagnostics (with
        # codes, live on unsaved edits) and inlay-hint types end to end.
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Rehearse the release
        working-directory: quirk-compiler
        # Package this commit exactly as release.yml would (compiler
        # tarball + per-package stdlib assets), then install it with
        # `quirk compiler install` from a local file:// release, in a
        # throwaway HOME. Catches packaging and updater breaks before a
        # tag ships them (7.3.0's stdlib assets first ran on the release).
        run: tools/rehearse_release.sh

      - name: Check project installs
        working-directory: quirk-compiler
        # `quirk install` / `sync` end to end with local packages (no
        # network): quirk.toml records deps under their own names,
        # transitive deps install, repeat installs and the cache are used.
        run: tools/check_install.sh

      - name: Run mutation fuzzer
        id: fuzz
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # Deterministic seed so a given commit always exercises the
        # same mutation tree — flakes would otherwise turn this into
        # a quality-eroding step. 300 iters keeps CI under ~30s while
        # still surfacing the kinds of bugs the fuzzer caught in
        # v3.0.3 (Sema gate miss → ICE, missing Codegen coercion).
        # Any unique crash (SIGSEGV / ICE / verifier abort) exits the
        # fuzzer with rc=2; we promote that to a build failure.
        run: |
          python3 tools/fuzz.py --iters 300 --seed 1 --quiet
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::fuzzer found new crash class(es) — see uploaded fuzz-findings artifact"
            for f in tools/fuzz_findings/*.quirk; do
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            done
          fi
          exit $rc

      - name: Upload fuzz findings on failure
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: quirk-compiler/tools/fuzz_findings/
          if-no-files-found: ignore
          retention-days: 7

  # The VS Code extension's analyzers under plain Node (quirk-vscode/test):
  # lint fixtures (expected warnings, and none elsewhere), every stdlib file
  # lints clean, and Ctrl+click resolves into a venv. Needs only the package
  # sources (bootstrap-stdlib clones them), no compiler build.
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bootstrap stdlib
        working-directory: quirk-compiler
        run: make bootstrap-stdlib

      - name: Install
        working-directory: quirk-vscode
        run: npm ci

      - name: Test
        working-directory: quirk-vscode
        run: npm test

  macos:
    # Same toolchain setup as release.yml's macos-arm64 job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # llvm@14 is keg-only on Homebrew, so it's pinned via LLVM_CONFIG
        # below. coreutils + gnu-sed: the probe and rehearsal scripts use
        # `timeout` and GNU sed escapes, which macOS doesn't ship.
        run: |
          brew install llvm@14 bdw-gc openssl@3 coreutils gnu-sed sdl2
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin"   >> "$GITHUB_PATH"

      - name: Bootstrap stdlib
        working-directory: quirk-compiler
        run: make bootstrap-stdlib

      - name: Build
        working-directory: quirk-compiler
        env:
          LLVM_CONFIG: /opt/homebrew/opt/llvm@14/bin/llvm-config
          CPATH: /opt/homebrew/opt/bdw-gc/include:/opt/homebrew/opt/openssl@3/include
          LIBRARY_PATH: /opt/homebrew/opt/bdw-gc/lib:/opt/homebrew/opt/openssl@3/lib
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Run probe suite
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
          QUIRK_CHECK_HEADERS: "1"
        run: tools/check_probes.sh

      - name: Check editor JSON
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # `--symbols-json` types and `--diagnostics-json` codes, as the
        # VS Code extension and quirk-lsp read them.
        run: tools/check_editor_json.sh

      - name: Check quirk test
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # `define test_*()` discovery, per-test results, setup/teardown,
        # crashes and -k, on tools/fixtures/quirk_test.
        run: tools/check_test_runner.sh

      - name: Check quirk run --watch
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # Runs again on a change, not when it doesn't compile; stops on SIGINT.
        run: tools/check_watch.sh

      - name: Check quirk bundle
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # A folder that runs moved elsewhere, with an empty environment.
        run: tools/check_bundle.sh

      - name: Check installed packages with the same names
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # Two packages in site-packages/ with a Theme and a dark() each.
        run: tools/check_site_packages.sh

      - name: Check package discovery
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
        # `quirk search` / `quirk show` against a file:// registry and
        # pre-filled caches — no network.
        run: tools/check_discovery.sh

      - name: Rehearse the release
        working-directory: quirk-compiler
        run: tools/rehearse_release.sh

      - name: Check project installs
        working-directory: quirk-compiler
        run: tools/check_install.sh

  ubsan:
    # Same shape as `test` but builds the runtime under UBSan so latent
    # undefined behaviour surfaces with a stack trace instead of
    # silently producing wrong-typed values. Sticks to UBSan only —
    # ASan + Boehm GC's conservative scan can produce confusing false
    # positives, so a separate ASan matrix entry would need work to
    # silence those. Worth doing once UBSan is clean.
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      # Public resolvers: Azure's (168.63.129.16, the runner default) stopped
      # resolving *.ubuntu.com on 2026-11-11, so apt-get couldn't reach the
      # archive (github.com etc. still resolved). Harmless when it works.
      options: --dns 8.8.8.8 --dns 1.1.1.1
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg lsb-release software-properties-common git

      - name: Add LLVM 14 apt repository
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/focal/ llvm-toolchain-focal-14 main" \
            > /etc/apt/sources.list.d/llvm-14.list
          apt-get update

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential gcc g++ make pkg-config \
            llvm-14 libllvm14 llvm-14-dev clang-14 \
            libgc-dev libssl-dev libubsan1 libsdl2-2.0-0

      - uses: actions/checkout@v4

      - name: Bootstrap stdlib
        working-directory: quirk-compiler
        run: make bootstrap-stdlib

      - name: Build runtime with UBSan
        working-directory: quirk-compiler
        # CFLAGS gets the sanitizer; the Makefile passes it through to
        # the runtime.so build. The compiler binary itself stays
        # vanilla so we're isolating UB in the runtime's C code, which
        # is where the probes are aimed.
        run: |
          make -j"$(nproc)" CXX=g++ CC=gcc
          # Rebuild runtime.so with UBSan flags.
          gcc -shared -fPIC -O1 -g \
              -fsanitize=undefined -fno-omit-frame-pointer \
              src/Runtime/runtime.c obj/third_party/sqlite/sqlite3.o -o bin/runtime.so -lgc -lssl -lcrypto -lm

      - name: Run probes under UBSan
        working-directory: quirk-compiler
        env:
          QUIRK_HOME: ${{ github.workspace }}/quirk-compiler
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1:abort_on_error=0"
        run: |
          set +e
          fails=0
          for p in tests/probes/p*.quirk tests/probes/p*.qk; do
            out=$(timeout 15 ./bin/quirk-cpp run --no-aot --no-cache "$p" 2>&1)
            # UBSan format: "<file>:<line>:<col>: runtime error: <msg>".
            # The leading path+line:col is what distinguishes a real
            # UBSan hit from Quirk's own `Quirk runtime error:` prints
            # (which are normal behavior in probes like p13's stack-
            # overflow trigger).
            if echo "$out" | grep -qE "\\.[ch]:[0-9]+:[0-9]+: runtime error:|UndefinedBehaviorSanitizer"; then
              echo "::error file=$p::UBSan hit in probe: $p"
              echo "$out" | head -20
              fails=$((fails + 1))
            fi
          done
          echo "UBSan failures: $fails"
          exit $fails

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: qtest
          channels: conda-forge

      - name: Install toolchain
        run: |
          conda install -y -c conda-forge llvmdev=14.0.6 clangdev=14.0.6 clang=14.0.6 \
            bdw-gc openssl sdl2=2.30 zlib zstd pthreads-win32 make lld=14.0.6

      - name: Bootstrap stdlib
        working-directory: quirk-compiler
        run: make bootstrap-stdlib

      # install.ps1 under Windows PowerShell 5.1 (what Windows has; it reads
      # a script without a BOM in the ANSI code page, so one non-ASCII
      # character — an em dash — broke the parse for users; pwsh didn't mind).
      - name: install.ps1 parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_ }; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\install.ps1")
          if ($bytes | Where-Object { $_ -gt 127 }) { Write-Host "install.ps1 has non-ASCII characters"; exit 1 }

      - name: Build, smoke-test and run the test suite (strict)
        working-directory: quirk-compiler
        env:
          QUIRK_WIN_STRICT: "1"
        run: bash tools/windows_build.sh

      # The build, as a release would ship it, to try a branch on Windows
      # before it's released (Actions → this run → Artifacts → windows-build;
      # install it with install.ps1: $env:QUIRK_INSTALL_TARBALL = <the .tar.gz>).
      - name: Package the build
        if: success()
        run: |
          V=$(grep -o 'QUIRK_VERSION = "[^"]*"' quirk-compiler/src/PackageManager.hpp | cut -d'"' -f2)
          PKG=$(quirk-compiler/tools/package_release.sh "$V" windows-x86_64 "$PWD")
          echo "QUIRK_PKG=${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Install the package on a bare PATH, open a window
        if: success()
        shell: pwsh
        run: |
          # The package alone (no conda env): SDL2.dll and the DLLs it loads
          # must be in it.
          $dir = Join-Path $env:RUNNER_TEMP 'quirk-install'
          $env:QUIRK_INSTALL_TARBALL = (Resolve-Path $env:QUIRK_PKG).Path
          ./install.ps1 -Dir $dir -NoModifyPath
          $env:Path = "$dir\bin;$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item env:QUIRK_HOME -ErrorAction SilentlyContinue
          Remove-Item env:CONDA_PREFIX -ErrorAction SilentlyContinue
          $w = Join-Path $env:RUNNER_TEMP 'window_smoke.qk'
          @'
          use window
          win := window.open("smoke", 120, 80, hidden=true)
          win.clear(window.hex("#336699"))
          win.present()
          win.close()
          print("window ok")
          '@ | Set-Content $w
          quirk --no-aot $w
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # `quirk bundle --name --icon --windowed`: a GUI .exe (no console) named
      # after the app, its icon in it (rc.exe from the MSVC environment).
      - name: Bundle a windowed app with an icon
        if: success()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'quirk-install'
          $env:Path = "$dir\bin;$env:Path"
          Remove-Item env:QUIRK_HOME -ErrorAction SilentlyContinue
          $app = Join-Path $env:RUNNER_TEMP 'deskapp'
          New-Item -ItemType Directory -Force $app | Out-Null
          Set-Content (Join-Path $app 'main.qk') "define main() -> void {`n    print(`"desk ok`")`n}`n"
          python -c "import struct,zlib,sys; w=h=32; raw=b''.join(b'\x00'+bytes([120,60,200,255])*w for _ in range(h)); c=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff); open(sys.argv[1],'wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b''))" (Join-Path $app 'icon.png')
          Push-Location $app
          quirk bundle main.qk -o dist --name "Test App" --icon icon.png --windowed
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          $exe = Join-Path $app 'dist\Test App.exe'
          if (-not (Test-Path $exe)) { Write-Host "no Test App.exe"; Get-ChildItem (Join-Path $app 'dist'); exit 1 }
          $b = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($sub -ne 2) { Write-Host "subsystem $sub, not 2 (GUI)"; exit 1 }
          $png = [byte[]](0x89, 0x50, 0x4E, 0x47)
          $found = $false
          for ($i = 0; $i -lt $b.Length - 4 -and -not $found; $i++) {
            if ($b[$i] -eq 0x89 -and $b[$i+1] -eq 0x50 -and $b[$i+2] -eq 0x4E -and $b[$i+3] -eq 0x47) { $found = $true }
          }
          if (-not $found) { Write-Host "no icon in the .exe"; exit 1 }
          $p = Start-Process -FilePath $exe -WorkingDirectory (Join-Path $app 'dist') -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "exit $($p.ExitCode)"; exit 1 }
          Write-Host "Test App.exe: GUI, with its icon, runs"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-build
          path: ${{ env.QUIRK_PKG }}
          retention-days: 7

      - name: Show failing tests
        if: failure()
        working-directory: quirk-compiler
        run: |
          grep -A25 '^Failures:' windows-probe/tests.txt 2>/dev/null | head -80 || true
          tail -40 windows-probe/build.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test
          path: quirk-compiler/windows-probe/
